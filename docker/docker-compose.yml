version: '3.8'

services:
  yamada-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: yamada_bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../src:/app/src  # Hot-reload para desarrollo
      - shared_data:/shared
    depends_on:
      - lavalink
    networks:
      - yamada-network

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: yamada_lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m
    volumes:
      - ./application.yml:/opt/lavalink/application.yml
      - shared_data:/shared
    ports:
      - "2333:2333"
    networks:
      - yamada-network

networks:
  yamada-network:
    driver: bridge

volumes:
  shared_data:
